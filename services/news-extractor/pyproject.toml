[project]
name = "four-refund-news-extractor"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["Pillow==13.0.0"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.14"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
