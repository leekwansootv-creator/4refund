name: News collection

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: news-collection
  cancel-in-progress: false

jobs:
  collect:
    # 운영 연결 승인 전에는 준비된 workflow가 외부 요청을 보내지 않는다.
    if: vars.NEWS_COLLECTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check pending work
        id: pending
        working-directory: services/news-extractor
        env:
          NEWS_WORKER_URL: ${{ secrets.NEWS_WORKER_URL }}
          NEWS_WORKER_TOKEN: ${{ secrets.NEWS_WORKER_TOKEN }}
        run: python3 -m news_extractor.queue_worker --probe
      - name: Install pinned dependency runner
        if: steps.pending.outputs.has_work == 'true'
        run: python3 -m pip install uv==0.13.4
      - name: Collect candidates
        if: steps.pending.outputs.has_work == 'true'
        env:
          NEWS_WORKER_URL: ${{ secrets.NEWS_WORKER_URL }}
          NEWS_WORKER_TOKEN: ${{ secrets.NEWS_WORKER_TOKEN }}
        run: uv run --locked --directory services/news-extractor python -m news_extractor.queue_worker
